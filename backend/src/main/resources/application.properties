spring.application.name=placement-tracker-backend

# ---- Database (from environment variables) ----
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/placement_tracker?useSSL=false&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---- JPA / Hibernate ----
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# ---- JWT ----
app.jwt.secret=${JWT_SECRET:change-this-to-a-long-random-secret-in-production-please}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ---- Server ----
server.port=${SERVER_PORT:8080}

# ---- CORS ----
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# ---- Swagger ----
springdoc.swagger-ui.path=/swagger-ui.html
