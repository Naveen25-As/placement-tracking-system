spring.application.name=placement-tracker-backend

# Optional local overrides: put KEY=value lines in backend/.env (git-ignored)
spring.config.import=optional:file:.env[.properties]

server.port=${PORT:8080}

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/placement_tracker?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=true

jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Comma-separated list of allowed CORS origins
app.frontend-url=${FRONTEND_URL:http://localhost:5173}

admin.name=${ADMIN_NAME:}
admin.email=${ADMIN_EMAIL:}
admin.password=${ADMIN_PASSWORD:}
