
services:
  # ============================
  # Spring Boot Backend
  # ============================
  - type: web
    name: placement-tracker-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile

    envVars:
      - key: DB_URL
        sync: false

      - key: DB_USERNAME
        sync: false

      - key: DB_PASSWORD
        sync: false

      - key: JWT_SECRET
        sync: false

      - key: JWT_EXPIRATION
        value: "86400000"

      - key: ADMIN_NAME
        sync: false

      - key: ADMIN_EMAIL
        sync: false

      - key: ADMIN_PASSWORD
        sync: false

      - key: FRONTEND_URL
        sync: false


  # ============================
  # React Frontend
  # ============================
  - type: web
    name: placement-tracker-frontend
    runtime: static
    rootDir: frontend

    buildCommand: npm install && npm run build

    staticPublishPath: dist

    envVars:
      - key: VITE_API_BASE_URL
        sync: false

    routes:
      - type: rewrite
        source: /*
        destination: /index.html

